name: Buscar Ofertas Diecast

on:

  # Permite testar manualmente
  workflow_dispatch:

  # Duas execuções por dia
  schedule:

    # 08:00 horário de Brasília
    - cron: "0 11 * * *"

    # 17:00 horário de Brasília
    - cron: "0 20 * * *"


permissions:
  contents: write


jobs:

  buscar-ofertas:

    runs-on: ubuntu-latest

    env:

      # SEARCHAPI
      SEARCHAPI_KEY: ${{ secrets.SEARCHAPI_KEY }}

      # EMAIL
      EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}


    steps:

      # ==================================================
      # BAIXAR REPOSITÓRIO
      # ==================================================

      - name: Baixar repositório
        uses: actions/checkout@v4


      # ==================================================
      # PYTHON
      # ==================================================

      - name: Configurar Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # ==================================================
      # DEPENDÊNCIAS
      # ==================================================

      - name: Instalar dependências

        run: |

          python -m pip install --upgrade pip

          pip install requests


      # ==================================================
      # EXECUTAR
      # ==================================================

      - name: Run python main.py

        run: |

          python main.py


      # ==================================================
      # SALVAR HISTÓRICO
      # ==================================================

      - name: Salvar histórico

        if: always()

        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
          "41898282+github-actions[bot]@users.noreply.github.com"


          if [ -f ofertas_vistas.json ]; then

            git add ofertas_vistas.json

          fi


          if [ -f links_para_afiliado.txt ]; then

            git add links_para_afiliado.txt

          fi


          if git diff --cached --quiet; then

            echo "Nenhuma alteração para salvar."

          else

            git commit -m "Atualizar ofertas diecast"

            git push

          fi
