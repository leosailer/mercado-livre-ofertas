name: Buscador Diecast Automatico

on:
  workflow_dispatch:

  schedule:
    # 08:00 até 11:30 - Brasília
    # A cada 30 minutos
    - cron: "0,30 11-14 * * *"

    # 12:00 até 19:45 - Brasília
    # A cada 15 minutos
    - cron: "0,15,30,45 15-22 * * *"

    # 20:00 até 22:45 - Brasília
    # A cada 15 minutos
    - cron: "0,15,30,45 23,0,1 * * *"

    # Última busca às 23:00 - Brasília
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Buscar ofertas e enviar email
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
        run: python main.py

      - name: Salvar historico e links
        run: |
          git config user.name "Buscador Diecast"
          git config user.email "actions@github.com"

          git add ofertas_vistas.json links_para_afiliado.txt

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao para salvar"
          else
            git commit -m "Atualiza ofertas e historico"
            git push
          fi
