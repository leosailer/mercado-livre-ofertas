name: Buscar Ofertas Diecast

on:
  workflow_dispatch:

  schedule:
    # A cada 30 minutos, das 07:00 até 23:30
    # Horário aproximado de Brasília convertido para UTC
    - cron: "*/30 10-23 * * *"
    - cron: "*/30 0-2 * * *"

permissions:
  contents: write

jobs:
  buscar-ofertas:

    runs-on: ubuntu-latest

    env:
      # EMAIL
      EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

      # NOVA API DE BUSCA
      SEARCHAPI_KEY: ${{ secrets.SEARCHAPI_KEY }}

      # MERCADO LIVRE
      # Mantemos cadastrados, mesmo que o teste atual
      # não precise deles.
      ML_ACCESS_TOKEN: ${{ secrets.ML_ACCESS_TOKEN }}
      ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
      ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
      ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}

      # SERPAPI
      # Mantido apenas como backup.
      # O novo código NÃO deverá depender dela.
      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}

    steps:

      # ==================================================
      # 1. BAIXAR REPOSITÓRIO
      # ==================================================

      - name: Baixar repositório
        uses: actions/checkout@v4


      # ==================================================
      # 2. CONFIGURAR PYTHON
      # ==================================================

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==================================================
      # 3. INSTALAR DEPENDÊNCIAS
      # ==================================================

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests


      # ==================================================
      # 4. EXECUTAR BUSCADOR
      # ==================================================

      - name: Run python main.py
        run: |
          python main.py


      # ==================================================
      # 5. SALVAR ARQUIVOS GERADOS
      # ==================================================

      - name: Salvar histórico
        if: always()
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
          "41898282+github-actions[bot]@users.noreply.github.com"

          # HISTÓRICO

          if [ -f ofertas_vistas.json ]; then
            git add ofertas_vistas.json
          fi

          # LINKS MERCADO LIVRE

          if [ -f links_para_afiliado.txt ]; then
            git add links_para_afiliado.txt
          fi

          # LINKS AMAZON

          if [ -f links_amazon.txt ]; then
            git add links_amazon.txt
          fi

          # VERIFICAR SE HOUVE ALTERAÇÃO

          if git diff --cached --quiet; then

            echo "Nenhuma alteração para salvar."

          else

            git commit -m "Atualizar histórico de ofertas"

            git push

          fi
